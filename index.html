<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <label for="draft">Черновик ответа (можно править)</label>
    <textarea id="draft" rows="5"></textarea>
  </section>
  <script type="module">
    import { createTriageController, TOPIC_LABELS } from "/triage-client.mjs";

    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    const view = {
      clearResult() {
        result.hidden = true;
        topic.textContent = "";
        draft.value = "";
        status.textContent = "";
      },
      showLoading() {
        status.textContent = "Разбираем заявку…";
      },
      showReady(topicCode, text) {
        status.textContent = "";
        topic.textContent = TOPIC_LABELS[topicCode] ?? topicCode;
        draft.value = text;
        result.hidden = false;
      },
      showInvalidInput() {
        status.textContent = "Введите текст заявки.";
      },
      showManualReview(reason) {
        // The request text stays in #message; the manager continues by hand.
        status.textContent = reason === "network"
          ? "Не удалось связаться с сервером. Обработайте заявку вручную: текст заявки сохранён выше."
          : "AI не смог подготовить надёжный ответ. Обработайте заявку вручную: текст заявки сохранён выше, а поле ниже можно заполнить самостоятельно.";
        topic.textContent = "—";
        draft.value = "";
        result.hidden = false;
        draft.focus();
      },
    };

    const controller = createTriageController({ fetchFn: (...args) => fetch(...args), view });
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      controller.submit(message.value);
    });
  </script>
</body>
</html>
